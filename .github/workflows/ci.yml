name: ci

on:
  push:
    branches: [main]
  pull_request:

# build-image builds the dev image from tools/Dockerfile.dev and pushes it
# to ghcr.io (multi-arch via QEMU; registry-mode buildx cache keeps
# nothing-changed runs cheap). Every other job is a gate that pulls that
# image by sha tag and runs inside it — see the `jobs:` map below for the
# authoritative list (round-trip corpora, disassembler oracle + round-trip,
# static checks, and the release byte-match gate).

permissions:
  contents: read
  packages: write   # build-image pushes to ghcr.io

env:
  IMAGE_NAME: ghcr.io/petemoore/sam-aarch64-dev

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emulation lets buildx produce linux/arm64 from this amd64
      # runner. Cost: arm64 simcoupé build runs emulated (~5-10x slower
      # than native), but with the registry cache it's a one-time cost
      # per simcoupé-patch change.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   sha-<full-sha>      — immutable, always set, used by the test job
      #                         to refer to "the image we just built"
      #   latest              — only on the default branch (main)
      #   pr-<N>              — only for PR events
      # The test job uses sha-<full-sha> for reproducibility; consumers
      # locally usually want :latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr,prefix=pr-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-mode buildx cache: each layer cached as an image
          # blob at the buildcache tag. Cleaner than actions/cache (no
          # size limits, properly de-duplicated across runs). Layers
          # invalidated when their inputs change or any earlier layer
          # changed — Dockerfile.dev orders rarely-changing layers
          # (SimCoupé) before frequently-changing ones (Go/samfile)
          # so the expensive SimCoupé build stays cached through
          # normal development iterations.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Run format tests
        env:
          AARCH64_AS: aarch64-linux-gnu-as
        run: make ci-format

  encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Run encoder tests
        env:
          AARCH64_AS: aarch64-linux-gnu-as
        run: make ci-encoder

  # disasm — strand-B Go disassembler oracle: aarch64dec vs binutils objdump
  # on a CODE-ONLY build of the release (release.s with all data removed at
  # source — data directives AND `ldr =imm` literal-pool pseudo-ops —
  # reassembled by GNU) so objdump's linear sweep sees only instructions.
  # Asserts an EXACT match. Pure Go + binutils, no container. A required
  # status check in the branch protection on main.
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Disassembler oracle (aarch64dec vs objdump)
        env:
          OBJDUMP: aarch64-linux-gnu-objdump
        run: make ci-disasm

  # disasm-roundtrip — strand-B PR-2: proves encode→decode→encode is
  # self-consistent for the core–paged fixture corpus.  Pure Go pipeline,
  # no aarch64 binutils or SimCoupé required.
  disasm-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Disassembler round-trip (encode→decode→encode)
        run: make ci-disasm-roundtrip

  # netboot-oracle — Phase-3 host harness: the DHCP/TFTP packet builders +
  # parsers (the SAM-side Z80 i82 client / i83 server / i86 DHCP authority)
  # replayed against masked golden vectors extracted from a real Pi 400
  # netboot capture.  Pure Go, no container, no binutils, no off-repo captures
  # (the committed golden vectors are the fixtures).  This gates the protocol
  # logic in isolation; the Z80 execution + ENC28J60 hardware + end-to-end Pi
  # boot are NOT host-verifiable and stay gated on i80/real-Trinity.
  netboot-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Netboot oracle (DHCP/TFTP golden vectors)
        run: make ci-netboot-oracle

  # registry-tests — the registry CLI's Go unit tests (id allocation / nextSubID,
  # parent invariants, gate column, in-progress, and the live-registry conformance
  # test). The registry-sync job validates the LIVE data during gen; this gates the
  # tool's LOGIC so a CLI regression can't merge green (i156).
  registry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Registry CLI unit tests
        run: make ci-registry

  # netboot-z80 — the SAM-side Z80 port of the netboot logic (src/netboot/*.asm),
  # assembled with pyz80 and run under the flat-memory koron-go/z80 harness
  # (tools/netboot-oracle/z80).  Two host-verifiable layers: (1) the packet
  # builders/parsers are pure arithmetic + memory writes, byte-compared against
  # the same golden vectors the Go authority is checked against; (2) the ENC28J60
  # wire I/O (i80) — the harness emulates the Trinity board (enc28j60.go) and runs
  # the real driver (encdrv.asm) with frame bytes in/out asserted byte-exact.
  # Needs pyz80 (so a pip install), unlike the pure-Go netboot-oracle job; still
  # no SimCoupé container.  An end-to-end Pi boot + real-silicon TX/RX timing
  # remain NOT host-verifiable (gated on real Trinity hardware).
  netboot-z80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install pyz80
        run: pip install --break-system-packages git+https://github.com/simonowen/pyz80
      - name: Netboot Z80 routines vs golden vectors
        run: make ci-netboot-z80
      - name: Bootable netboot disks build
        run: make netboot-smoke-disk netboot-server-disk netboot-serve-disk netboot-client-disk netboot-http-disk
      - name: Serve push launcher config-patch test (i121d)
        run: make netboot-trinpush-test

  # sysreg-sync — Go↔Z80 sysreg table sync guard (repo-audit §5 / §6 #9).
  # Two complementary checks, both pure Go (no container, no binutils):
  #
  #   sysreg-sync-check  — decodes the Z80 table src/sysreg_tables.inc and
  #     asserts it agrees byte-for-byte with the Go authority
  #     tools/sam-aarch64-format/sysregs.go for every sysreg/pstate/dc/tlbi
  #     entry (TestSysregZ80Sync).  Emitter-faithfulness guard (i7): catches a
  #     generator bug — wrong field order, missing terminator.
  #   tables-sync-check  — regenerates the committed generated tables with
  #     tools/tables-gen and diffs against the in-tree copies; fails on any
  #     drift (a Go-side edit that forgot `make tables`, or a hand edit to a
  #     generated file).  Freshness guard (i7): closes the hand-sync drift
  #     class for src/sysreg_tables.inc.
  sysreg-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run sysreg Go↔Z80 sync guard
        run: make sysreg-sync-check
      - name: Run generated-table freshness guard
        run: make tables-sync-check

  # registry-sync — the iN/qN work-item registry is generated from the YAML
  # source (registry/items.yaml + questions.yaml + priority.yaml). This guard
  # validates the source against every invariant and regenerates the committed
  # docs/notes/*-registry-*.md + backlog.md, failing on any drift — so a
  # hand-edit of a generated .md, or a stale regeneration, is rejected here.
  registry-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build the registry CLI
        run: make registry-gen
      - name: Validate the registry source (all invariants)
        run: |
          REGISTRY_ITEMS=registry/items.yaml REGISTRY_QUESTIONS=registry/questions.yaml \
          REGISTRY_DIR=registry REGISTRY_PRIORITY=registry/priority.yaml \
          build/registry validate registry/items.yaml registry/questions.yaml
      - name: Registry generated-views freshness guard
        run: make registry-sync-check

  # staticcheck — dead-code (unused / U1000) gate across the core host
  # toolchain modules. Pure Go, no container; the checker is built with
  # go1.26.1 (the modules' toolchain) via GOTOOLCHAIN inside the recipe.
  # Also hosts the doc link checker (dangling-markdown-link guard).
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: staticcheck unused-code gate
        run: make staticcheck
      - name: doc link checker
        run: make check-doc-links

  # core — sweeps the fixture corpus end-to-end on the dev container:
  #   sam-aarch64 → build-disk → SimCoupé (Xvfb 24bit) → samfile extract
  #   → byte-diff against GNU as + objcopy.
  core:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Inside the dev container, the checked-out repo is owned by the
      # host UID; git refuses to operate on dirs owned by "other" users
      # by default, and `go build` then fails with "error obtaining VCS
      # status: exit status 128".  Mark the work tree safe before any
      # Go build step.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run core fixture corpus
        run: make ci-core

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== core fixtures ====="
          ls tests/core/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/core-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # symbols — sweeps the symbols fixture corpus end-to-end.  Same container
  # as the core job, but uses tests/symbols/run-roundtrip.sh which runs the
  # oracle through `ld -Ttext=0` so :lo12: / branch-to-label relocations
  # resolve.  Reuses the same assembler binary (symbols-capable).
  symbols:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run symbols fixture corpus
        run: make ci-symbols

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== symbols fixtures ====="
          ls tests/symbols/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/symbols-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # symbols-prod — production-variant sweep — same symbols fixture corpus,
  # but uses the smaller production assembler binary (no boot-time self-tests).
  # Guards against accidental divergence between the two variants:
  # both must produce byte-identical OUT for every fixture.  core-prod
  # is omitted because the prod variant only differs in self-test
  # presence (not operand handling), so passing the harder symbols corpus
  # implies the core corpus also passes.
  symbols-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run symbols fixture corpus (production assembler)
        run: make ci-symbols-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== symbols fixtures (prod variant) ====="
          ls tests/symbols/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/symbols-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # operands — sweeps the operands fixture corpus end-to-end.  Same container
  # as the core / symbols jobs; runs `make ci-operands`, which exercises the
  # compound-operand encoders (OpShiftedReg, OpExtendedReg, OpMem,
  # OpSysName, OpLitPool), the ror-imm intercept, and the operands
  # directives (.set / .equ / .balign / .align / .org / .skip /
  # .space / .inst / .ltorg / no-op family).
  operands:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run operands fixture corpus
        run: make ci-operands

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== operands fixtures ====="
          ls tests/operands/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/operands-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # operands-prod — same operands fixture corpus, but uses the smaller
  # production assembler binary (no boot-time self-tests).  Catches any
  # divergence between the test and production variants in the operand
  # encoders / directives.
  operands-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run operands fixture corpus (production assembler)
        run: make ci-operands-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== operands fixtures (prod variant) ====="
          ls tests/operands/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/operands-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # paged — sweeps the paged fixture corpus end-to-end.  Same container as
  # core..operands; runs `make ci-paged` which exercises the paged-OUT
  # machinery introduced by paged IN/OUT (sections-B emit during the
  # LMPR_ENCTAB window + LMPR_OUT_HIGH bracket for the high zone + HSAVE
  # auto-paging across &C000).  The fixture corpus contains a >16 KB
  # long-emit fixture that crosses the OUT_ZONE low → high boundary.  See
  # docs/specs/paged-out-design.md.
  paged:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run paged fixture corpus
        run: make ci-paged

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== paged fixtures ====="
          ls tests/paged/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/paged-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # paged-prod — same paged fixture corpus, but uses the smaller production
  # assembler binary (no boot-time self-tests).  Catches divergence between
  # the test and production variants on the paged-OUT code path.
  paged-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run paged fixture corpus (production assembler)
        run: make ci-paged-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== paged fixtures (prod variant) ====="
          ls tests/paged/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/paged-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # release-gate — THE HEADLINE GATE (3-way byte-match).  Proves the
  # standing claim "spectrum4 release.bin byte-match on SAM" by showing
  # three independent toolchains agree, byte-for-byte, on the vendored
  # spectrum4 release:
  #   1. GNU binutils  — the vendored tests/release/release.img.
  #   2. our Go path   — sam-aarch64 (release.s → .tbn → bin).
  #   3. our Z80 path  — the SAM assembler on SimCoupé (.tbn → OUT).
  # Without it, the origin-dependent encoder logic (ORIGIN_HIGH /
  # SYMTAB_ABS_BITMAP / 33-bit-ADRP) could silently regress, because the
  # roundtrip links at -Ttext=0 and never exercises the release origin.
  #
  # Hermetic + fast: BOTH inputs are vendored (tests/release/), so this
  # needs no spectrum4 checkout, no tup, and no aarch64 binutils at CI time
  # — just the dev image.  release.s is the whole release flattened into one
  # self-contained source by `sam-aarch64 -E`; the gate regenerates the .tbn
  # from it, so it also exercises sam-aarch64's flatten/strip pipeline (if
  # .tbn generation broke, the Go and Z80 outputs would diverge from the
  # GNU image).  Refresh both files with tools/revendor-release.sh.
  #
  # Also runs `make check-budget`, so a code-size overrun past the &C000
  # stack-page cliff fails here with a number rather than as a silent
  # boot-hang (the test-variant fragility class; tools/check-code-budget.sh).
  release-gate:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      SIMCOUPE_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: spectrum4 release 3-way byte-match (GNU == Go == Z80)
        run: tools/run-release-gate.sh

      - name: Post-mortem on failure
        if: failure()
        run: |
          echo "===== SAM assembler status log ====="
          cat build/release.status.log 2>/dev/null || echo "(no status log)"
          echo "===== sizes ====="
          wc -c tests/release/release.img build/release.go.img build/release.sam.img 2>/dev/null || true
          echo "===== GNU vs Go ====="
          cmp -l tests/release/release.img build/release.go.img 2>/dev/null | head -20 || true
          echo "===== GNU vs Z80 (SAM) ====="
          cmp -l tests/release/release.img build/release.sam.img 2>/dev/null | head -20 || true
