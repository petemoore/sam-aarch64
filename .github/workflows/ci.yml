name: ci

on:
  push:
    branches: [main]
  pull_request:

# Workflow has two jobs:
#
#   build-image: builds the dev image from tools/Dockerfile.dev and pushes
#                it to ghcr.io. Multi-arch (amd64 + arm64) via QEMU. Runs
#                on every push/PR; nothing-changed runs are cheap because
#                the registry-mode buildx cache makes most layers no-ops.
#
#   test:        pulls the image just published by build-image, runs the
#                M0 round-trip oracle inside it.
#
# Both jobs see the same `github.sha`, so the test job can refer to the
# image by `sha-<full-sha>` tag and is guaranteed to find it.

permissions:
  contents: read
  packages: write   # build-image pushes to ghcr.io

env:
  IMAGE_NAME: ghcr.io/petemoore/sam-aarch64-dev

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emulation lets buildx produce linux/arm64 from this amd64
      # runner. Cost: arm64 simcoupé build runs emulated (~5-10x slower
      # than native), but with the registry cache it's a one-time cost
      # per simcoupé-patch change.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   sha-<full-sha>      — immutable, always set, used by the test job
      #                         to refer to "the image we just built"
      #   latest              — only on the default branch (main)
      #   pr-<N>              — only for PR events
      # The test job uses sha-<full-sha> for reproducibility; consumers
      # locally usually want :latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr,prefix=pr-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-mode buildx cache: each layer cached as an image
          # blob at the buildcache tag. Cleaner than actions/cache (no
          # size limits, properly de-duplicated across runs). Layers
          # invalidated when their inputs change or any earlier layer
          # changed — Dockerfile.dev orders rarely-changing layers
          # (SimCoupé) before frequently-changing ones (Go/samfile)
          # so the expensive SimCoupé build stays cached through
          # normal development iterations.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Run M1 tests
        env:
          AARCH64_AS: aarch64-linux-gnu-as
        run: make ci-m1

  m2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install aarch64 binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Run M2 tests
        env:
          AARCH64_AS: aarch64-linux-gnu-as
        run: make ci-m2

  # sysreg-sync — Go↔Z80 sysreg table sync guard (repo-audit §5 / §6 #9).
  # Asserts the hand-maintained Z80 table src/sysreg_data.asm agrees
  # byte-for-byte with the Go authority tools/sam-aarch64-format/sysregs.go
  # for every sysreg/pstate/dc/tlbi entry the Z80 side carries, so the two
  # copies can't silently drift. Pure Go, no container, no binutils —
  # mirrors the lightweight m1/m2 jobs.
  sysreg-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run sysreg Go↔Z80 sync guard
        run: make sysreg-sync-check

  # M3 — sweeps the fixture corpus end-to-end on the dev container:
  #   text2bin → build-m3-disk → SimCoupé (Xvfb 24bit) → samfile extract
  #   → byte-diff against GNU as + objcopy.
  # Mirrors the `test:` job's container setup but builds the M3 disks
  # and runs each fixture in turn via tests/m3/run-roundtrip.sh.
  m3:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Inside the dev container, the checked-out repo is owned by the
      # host UID; git refuses to operate on dirs owned by "other" users
      # by default, and `go build` then fails with "error obtaining VCS
      # status: exit status 128".  Mark the work tree safe before any
      # Go build step.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M3 fixture corpus
        run: make ci-m3

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M3 fixtures ====="
          ls tests/m3/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m3-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M4 — sweeps the M4 fixture corpus end-to-end.  Same container as the
  # M3 job, but uses tests/m4/run-roundtrip.sh which runs the oracle
  # through `ld -Ttext=0` so :lo12: / branch-to-label relocations
  # resolve.  Reuses the M3 assembler binary (M4-capable post-PR-#22).
  m4:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M4 fixture corpus
        run: make ci-m4

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M4 fixtures ====="
          ls tests/m4/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m4-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M4 production-variant sweep — same M4 fixture corpus, but uses the
  # smaller production assembler binary (no boot-time self-tests).
  # Guards against accidental divergence between the two variants:
  # both must produce byte-identical OUT for every fixture.  M3-prod
  # is omitted because the prod variant only differs in self-test
  # presence (not operand handling), so passing the harder M4 corpus
  # implies the M3 corpus also passes.
  m4-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M4 fixture corpus (production assembler)
        run: make ci-m4-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M4 fixtures (prod variant) ====="
          ls tests/m4/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m4-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M5 — sweeps the M5 fixture corpus end-to-end.  Same container as
  # the M3 / M4 jobs but runs `make ci-m5`, which exercises the M5
  # compound-operand encoders (OpShiftedReg, OpExtendedReg, OpMem,
  # OpSysName, OpLitPool), the ror-imm intercept, and the M5
  # directives (.set / .equ / .balign / .align / .org / .skip /
  # .space / .inst / .ltorg / no-op family).
  m5:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M5 fixture corpus
        run: make ci-m5

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M5 fixtures ====="
          ls tests/m5/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m5-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M5 production-variant sweep — same M5 fixture corpus, but uses
  # the smaller production assembler binary (no boot-time self-tests).
  # Catches any divergence between the test and production variants
  # in the new M5 encoders / directives.
  m5-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M5 fixture corpus (production assembler)
        run: make ci-m5-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M5 fixtures (prod variant) ====="
          ls tests/m5/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m5-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M6 — sweeps the M6 fixture corpus end-to-end.  Same container as
  # M3..M5; runs `make ci-m6` which exercises the paged-OUT machinery
  # introduced in M6 PR 1 (sections-B emit during the LMPR_ENCTAB
  # window + LMPR_OUT_HIGH bracket for the high zone + HSAVE
  # auto-paging across &C000).  The fixture corpus is currently a
  # single >16 KB long-emit fixture that crosses the OUT_ZONE
  # low → high boundary.  See
  # docs/specs/2026-05-27-m6-paged-out-design.md.
  m6:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M6 fixture corpus
        run: make ci-m6

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M6 fixtures ====="
          ls tests/m6/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m6-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # M6 production-variant sweep — same M6 fixture corpus, but uses
  # the smaller production assembler binary (no boot-time self-tests).
  # Catches divergence between the test and production variants on
  # the paged-OUT code path.
  m6-prod:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      AARCH64_AS: aarch64-linux-gnu-as
      AARCH64_LD: aarch64-linux-gnu-ld
      AARCH64_OBJCOPY: aarch64-linux-gnu-objcopy
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run M6 fixture corpus (production assembler)
        run: make ci-m6-prod

      - name: Post-mortem disk inspection on failure
        if: failure()
        run: |
          echo "===== M6 fixtures (prod variant) ====="
          ls tests/m6/sources/
          echo "===== build/ artefacts ====="
          ls -la build/ | grep -E 'mgt|tbn|bin' || true
          for log in /tmp/m6-*.log; do
            [ -f "$log" ] || continue
            echo "===== $(basename $log) ====="
            tail -20 "$log"
          done

  # m6-release — THE M6 HEADLINE GATE (3-way byte-match).  Proves the
  # standing claim "spectrum4 release.bin byte-match on SAM" by showing
  # three independent toolchains agree, byte-for-byte, on the vendored
  # spectrum4 release:
  #   1. GNU binutils  — the vendored tests/m6/release/release.img.
  #   2. our Go path   — text2bin (release.s → .tbn) + refenc (.tbn → bin).
  #   3. our Z80 path  — the SAM assembler on SimCoupé (.tbn → OUT).
  # Without it, the origin-dependent encoder logic (ORIGIN_HIGH /
  # SYMTAB_ABS_BITMAP / 33-bit-ADRP) could silently regress, because the m6
  # roundtrip links at -Ttext=0 and never exercises the release origin.
  #
  # Hermetic + fast: BOTH inputs are vendored (tests/m6/release/), so this
  # needs no spectrum4 checkout, no tup, and no aarch64 binutils at CI time
  # — just the dev image.  release.s is the whole release flattened into one
  # self-contained source by `text2bin -E`; the gate regenerates the .tbn
  # from it, so it also exercises text2bin's flatten/strip pipeline (if .tbn
  # generation broke, the Go and Z80 outputs would diverge from the GNU
  # image).  Refresh both files with tools/revendor-m6-release.sh.
  #
  # Also runs `make check-budget`, so a code-size overrun past the &C000
  # stack-page cliff fails here with a number rather than as a silent
  # boot-hang (the test-variant fragility class; scripts/check-code-budget.sh).
  m6-release:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/petemoore/sam-aarch64-dev:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      SIMCOUPE_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: spectrum4 release 3-way byte-match (GNU == Go == Z80)
        run: tools/run-m6-release-gate.sh

      - name: Post-mortem on failure
        if: failure()
        run: |
          echo "===== SAM assembler status log ====="
          cat build/m6-release.status.log 2>/dev/null || echo "(no status log)"
          echo "===== sizes ====="
          wc -c tests/m6/release/release.img build/m6-release.go.img build/m6-release.sam.img 2>/dev/null || true
          echo "===== GNU vs Go ====="
          cmp -l tests/m6/release/release.img build/m6-release.go.img 2>/dev/null | head -20 || true
          echo "===== GNU vs Z80 (SAM) ====="
          cmp -l tests/m6/release/release.img build/m6-release.sam.img 2>/dev/null | head -20 || true
