- id: i190
  title: One shared koron-z80 SAM-emulation core used by both Go harnesses (no duplicated impl; post-SAMBOOT)
  description: |
    PRINCIPLE (Pete, 2026-06-21, REFINED — read before implementing): the goal is NOT to merge the two harnesses into one tool. It is to STOP DUPLICATING the SAM-Coupé emulation IMPLEMENTATION. There must be ONE Go SAM-Coupé emulation core on the koron-go/z80 library — the CPU + memory/paging + IO model (the sampage package, created by i181, is the seed) — that BOTH harnesses USE rather than each carrying its own copy of the same features. The two harnesses MAY stay distinct codebases/packages where they are logically separate and benefit from independence: the assembler harness (tools/z80-test-harness-go) is assembler/disassembler-focused with DOS-hook + printer devices; the netboot harness (tools/netboot-oracle/z80) is netboot-focused with ENC28J60 + EEPROM + trinload. Do NOT force logically-separate tools together. Over-arching rule: don't duplicate implementations — if both share the same underlying emulation library, the problem is resolved.
    CONCRETELY: the LMPR/HMPR paging + ROM write-protect currently exists TWICE — in the assembler harness (resolveRead/resolveWritePage) and, since i181, in sampage (used by the netboot harness). That duplication is what let the dumper's &C000 ROM-paging bug reach hardware (one harness had the model, the other didn't). i190 = make the assembler harness ALSO use the shared core (replace its inline pager with sampage; promote sampage to a location both modules can import) so the paging/memory model is implemented ONCE. Devices (ENC28J60/EEPROM/DOS-hooks/trinload) live where they are used — they are not duplicated, so no merge is needed. The pure-Go protocol oracle (frame/tftp/dhcp) is unaffected. ACCEPTANCE: the SAM CPU+memory+paging+ROM model exists in exactly one place that both harnesses import; both existing test suites pass; the harnesses may remain separate packages/modules.
  status: DONE
  depends_on: [i208]
  kind: umbrella
  owner: agent

