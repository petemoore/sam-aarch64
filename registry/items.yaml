    Design for single serialized format + pass-free syntactic encoder. Decision A: the compact overlay is the only serialized .tbn; the symbolic kinds (KindInst/LabelDef/LocalDef/LitInsts) become an in-memory IR, never written. Decision B: text->overlay is a pure syntactic transform; value-dependent bits computed in the fold at assemble time; forego GNU silent rewrites; narrow assemble-time mov->movz/orr/movn fallback. Host side COMPLETE (i48a #144, i48b, i48d). i48c (Z80 text->overlay encoder) is the M9 carry-forward.
  status: OPEN
  kind: umbrella
  owner: agent
