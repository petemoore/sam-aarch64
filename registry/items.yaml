- id: i120
  title: Windowed TFTP (RFC 7440) for the netboot client/server — throughput optimization
  description: |
    i118 drops windowsize from the client RRQ to stay a correct lock-step (one ACK per block) client. That costs round-trips on large transfers (an 800 KB .mgt at blksize 1428 ~574 lock-step round-trips over the SAM's slow ~20-80 KB/s SPI stack). Windowed delivery (window 4 -> ~4x fewer round-trips) is the throughput win. Requires the receiver to ACK only the last block of each window (+ handle lost-block/out-of-window rewind) on both client (i82) and server (i83/i95); re-add windowsize to ClientOptionSet only once windowed logic exists on both sides + is host-verified.
  status: OPEN
  kind: leaf
  owner: agent
  refs: [tools/netboot-oracle/tftp/, src/netboot/netboot_client.asm, docs/notes/tftp-protocol-research.md, i118, i82, i83, i95]

