    DONE. TestRealBootInitRunsBeforeChunk1 (tools/netboot-oracle/z80/samboot_real_boot_test.go) traces the from-reset boot and confirms the normal ROM cold-init runs BEFORE the &4000 handoff: MNINIT &EBAE -> NEW2 &EC8F -> the streams-zap loop &ECB6/&ECC8 all execute, then &4000. So chunk 1 is a library entry on a live, initialised system, not a cold entry (§7.4 hypothesis confirmed). A sentinel experiment (plant 0xAA at &5C26's physical-page-0 offset before boot, observe it overwritten to 0x00) proves &5C26 == 0 is the value NEW2's CLSTL loop WRITES (a deliberately-zeroed STREAMS entry, &5C0C-&5C35), CORRECTING the §7.5 'zero because init had not run yet' reading: init DID run; there is no missing multi-stage loader. samboot-bootblock-analysis.md §7.6 records the verification + correction. Refs: §7.6.
