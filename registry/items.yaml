- id: i197c-b3
  title: "SAMBOOT: finalize the injection site (the boot-entry 'contradiction' was an EEPROM-addressing bug)"
  description: |
    DONE (#588). The 'boot-entry contradiction' (ROM fetches a library at &2000; coherent sequencer at &0000; ask Colin/re-capture) was NOT real — it was a fidelity bug in the emulator's EEPROM addressing. The captured eeprom.bin is CHUNK-ORDERED: the dumper reads by chunk number (chunks 1..128) and chunk 1's data is at device &2000, so file offset 0 = device &2000 and file F = device (F+&2000) mod &20000 (the 128KB device wraps; the EEPROM index even names entry 0 'Boot Block', entry 13 'Trinity Network '). CAPTURE-NOTES + the earlier analysis assumed file==device, so the model served the wrong chunk for device &2000 (a B-DOS helper library at file &2000 = device &4000 = chunk 9) and the boot wandered. deviceLinearEEPROM un-rotates the capture; the real boot then runs COHERENTLY: ROM fetches device &2000 = chunk 1 = the BOOTBLOCK, which loads B-DOS chunks 2..13 into &8000 (12 read_chunk loads) and reaches CALL &805F (B-DOS init; halts at &AB18 on unmodeled SD/screen) — the EEPROM auto-load Pete's card performs. INJECTION SITE SETTLED: the bootblock (chunk 1, device &2000) at the post-&805F hook (samboot-bootblock-analysis.md §7.1/§7.2/§8). Tests: TestRealBootLoadsBootblockAtChunk1 + TestRealBootLoadsBDOSCoherently. No Colin/re-capture needed. Refs: §8.
