- id: i180
  title: "Registry: make priority topo invariant + auto-repair umbrella-aware (expand umbrella deps to pullable leaves)"
  description: |
    Root cause (found while reshuffling SAMBOOT): validatePriority check 4 (validate.go:586) and topoRepairPriority (mutators.go:100) both SKIP any depends_on edge whose target is not itself a pullable queue entry. An umbrella is never pullable, so a leaf->umbrella edge (e.g. i133->i135) imposes ZERO ordering constraint and the umbrella's real prerequisite leaves (i135c/i135d) are never substituted in -> i133 can sit ahead of its prerequisites and validate (run by CI) stays green. Fix: expand a depends_on edge targeting an umbrella to its open pullable leaf descendants in BOTH validate check 4 and the topo-repair; add regression tests (leaf->umbrella ordering, currently uncovered). Then the auto-repair corrects priority.yaml. Spec: docs/specs/registry-source-of-truth-design.md (Priority queue + ready / validate).
