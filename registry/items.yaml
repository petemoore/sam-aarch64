    sha_bigsigma0/1/sha_sigma0/1 interleave st_bcde_tmpa + 1-2 xor_bcde_tmpa passes over the 4-byte sha_tmpa, each reloading ld hl,sha_tmpa (10 T). Since the intervening rotate macros preserve HL and XOR is per-byte order-independent, each pass after the first can chain from where the previous left HL: new xor_bcde_tmpa_bwd / xor_bcde_tmpa_fwd macros drop the reload. Saves 2 reloads each in Sigma functions (x64 rounds) + 1 each in sigma functions (x48 extend words) = -3520 T/block: 346,267->342,747 (-1.0%). NIST KAT byte-exact; 8x-unroll generator + regen guard untouched.
