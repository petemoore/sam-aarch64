- id: i25
  title: "File-I/O error handler via DOSER (&5BC0)"
  description: |
    Surface SAMDOS file-I/O failures (HGTHD/HLOAD/HSAVE file-not-found, disk-full, wrong-type, ...) to the user instead of crashing the assembler. The app-facing error vector is DOSER (&5BC0), NOT (hksp) (see i185: (hksp) is zeroed on every hook entry — samdos/src/b.s:450-451 — and is SAMDOS-internal/NMI-only; an app handler there is never reached). Mechanism: port COMET's idiom (comet.asm prepare/dier/sproom, 1265-1382) — set (&5BC0) to a handler before file ops; ROM PTDOS does JP (DOSER) after every hook (rom DOSC :12977-12980,13003) with A = error number (0 on success). Scope: alt D (minimal, chosen) — the handler does AND A; RET Z on success, else converts the error into the existing diagnosed FAIL (jp fail with a load/save tag, reusing src/assembler.asm fail/fail_with_tag + src/print.asm); alt A (future enhancement) — per-error-number messages + stack recovery so the program could continue rather than halt. Also CORRECT the i183 harness, which models the wrong vector ((hksp)): model the DOSER post-hook dispatch (success + error) and treat an app-set (hksp) as zeroed, so the handler is verified against the real mechanism (emulation-first). Refs: docs/specs/samdos-file-io.md, comet.asm:1265-1382, src/loader.asm + src/main_loop.asm (hook call sites), tools/z80-test-harness-go/harness.go.
  status: OPEN
  depends_on: [i183, i185]
  kind: umbrella
  owner: agent

- id: i25a
  title: "Harness: model DOSER (&5BC0) post-hook dispatch (correct i183's (hksp) vector)"
  description: |
    Harness models the DOSER (&5BC0) post-hook dispatch (success + error, A = SAMDOS error number) per ROM DOSC, replacing i183's non-functional (hksp) model. doserDispatch fires after every file-I/O hook; with a handler installed it models JP (DOSER), else default-halt on error. Verified via micro-programs that install a DOSER handler at &5BC0. Emulation-first prerequisite for the SAM handler (i25b).
  status: DONE
  kind: leaf
  owner: agent
  prs:
    - {num: 510, role: completing}
  parent: i25

- id: i25b
  title: "SAM-side DOSER (&5BC0) file-I/O error handler (port COMET)"
