- id: i12b
  title: Editor-testing input injection (SimCoupé -keyin end-to-end proof)
  description: |
    DETERMINED (PR #502, Outcome B): SimCoupé's -keyin is a boot-prompt autotyper, NOT a general key feed for a running program; it cannot reliably deliver keystrokes to a post-boot SAM CODE program that polls FLAGS(&5C3B)/LASTK(&5C08) (the editor-input use case). Verified locally (SDL_VIDEODRIVER=offscreen, isolated HOME): a diagnostic stub booted with SIMCOUPE_KEYIN='BOOT\nABCABC\n', confirmed CanType() satisfied at the stub (read LMPR=&1F → Section A=ROM0, B=page0), and polled FLAGS for several seconds — bit5 never set and zero keys arrived. Root cause (SimCoupé Base/SAMIO.cpp + Base/Keyin.cpp): (1) the string loads ONCE at the WTFK startup screen with no re-arm; (2) keys stream only from the IMEXIT hook so the target needs interrupts ON; (3) Rst8Hook()'s `default: Keyin::Stop()` drops the pending string on any RST-8 code outside &00/&1d/&35/&13/&50, which DOS/BASIC trip during the boot→program handoff. The reliable, deterministic, CI-gated vehicle for editor INPUT tests is the Go harness InjectKeys (i138, keyboard_test.go) — the same LASTK/FLAGS mechanism driven directly; SimCoupé stays the boot/render gate via the existing fixture jobs. The full determination + reproduction lives in the -keyin comment block of tools/run-simcoupe.sh (single home). PR #502 also fixed a real run-simcoupe.sh bug: SimCoupé splits the parallel-printer capture across simc0000.txt, simc0001.txt… after inactivity gaps, and the wrapper globbed only the first file (silently dropping gapped output); it now concatenates all simc*.txt in numeric order. No flaky -keyin CI job was added.
  status: DONE
  kind: leaf
  owner: agent
  prs:
    - {num: 502, role: completing}
  parent: i12
  refs: [tools/run-simcoupe.sh, src/netboot/key_read_test.asm, i138]

