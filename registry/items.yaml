- id: i181
  title: "Harness: model SAM LMPR/HMPR paging + stock-ROM fixture to emulation-verify ROM-paging sequences"
  description: |
    Per CLAUDE.md §7 (emulation-first): the koron-z80 harness records HMPR/LMPR writes but does not act on them (enc28j60.go:345-348; harness.go is flat), so the i173 dumper's ROM-page-read SEQUENCE (port values, ROM0/ROM1 select, ROM1-off-to-protect-STAGE, no stack self-eviction) cannot be emulation-tested. Model paging: a 512KB physical RAM array, 16KB pages mapped per LMPR/HMPR, ROM0/ROM1 from a loaded stock SAM ROM 3.0 fixture. Then a test can assert the dumper's paging sequence yields the stock ROM bytes (catching port/self-eviction bugs in emulation). Returns STOCK not PATCHED bytes, so it validates the SEQUENCE not the capture (the capture is inherently hardware, i87a). Follow-up surfaced by the i173 design; NOT a blocker for i173 (whose ROM read is charter-classified hardware-first).
  status: OPEN
  kind: leaf
  owner: agent

- id: i182
  title: Bootable fetch-and-boot disk + real-Trinity run of client_fetch_boot
  description: |
    i122c delivered the host-verified PXE-style fetch-and-boot orchestration entry (client_fetch_boot: EEPROM identity -> TFTP-fetch a .mgt straight into a scratch record via the raw_record_sink -> validate -> ALHK-boot). To exercise it on real hardware, build a bootable SAM disk whose autorun invokes client_fetch_boot (a netboot-fetch-boot-disk make target mirroring netboot-client-disk), decide the autorun entry vs client_main, and run it on real SAM+Trinity: serve a stamped 819200-byte .mgt, confirm it streams into the scratch record (1600 HWSAD sectors), validates, and ALHK-boots it. Hardware-gated (the whole point is the real SD write + real boot, unverifiable in emulation); entangled with the auto-boot/control-return autonomy (i132/i135). The full-size valid stream is also not driven through the bit-banged ENC in the host harness, so the real wire run is the first full-scale fetch-and-boot.
  status: OPEN
  depends_on: [i122c]
  kind: leaf
  owner: pete
