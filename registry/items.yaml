- id: i28
  title: "Absolute .set/.equ high-word edge: negative absolute emitted wrong high word (0x00000000 vs 0xFFFFFFFF)"
  description: |
    Z80 stored only low 32 bits and reconstructed high word as zero. Fix: eval_push_sym_sign_high sign-extends bit 31 (add a,a / sbc a,a idiom). Correct for whole accepted set: absolute-classification already refuses values whose high word isn't 0x00000000/0xFFFFFFFF. Positive absolutes still get high 0; release.bin byte-identical. Pinned by tests/symbols/sources/set_neg_highword.s (.quad of -256, -1, 0x10000000).
  status: DONE
  kind: leaf
  owner: agent
  prs:
