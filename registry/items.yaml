- id: i127
  title: "netboot client: transmit the ARP only once the ENC PHY link is up"
  description: |
    client_main broadcast its proactive ARP immediately after drv_init, but drv_init never waited for PHY link-up; on real hardware the PHY silently dropped the first ARP, causing a livelock (flickering-border, silent-wire symptom). Fix (a): drv_wait_link (enc_link.asm) polls PHSTAT2.LSTAT over the MII until link is up, called in client_main between drv_init and client_first. Built + emulation-verified PR #424; HARDWARE-CONFIRMED 2026-06-19 rec 13. Fix (b) ARP-retransmit-on-timeout NOT implemented — (a) alone is sufficient. Emulator model + regression landed as i131 (PR #427).
