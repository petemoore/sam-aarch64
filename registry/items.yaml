- id: i2
  title: "On-SAM IDE memory model (edit buffer + IN/OUT paging; claim all free RAM, grow on demand)"
  description: |
    On-SAM IDE memory model — DECIDED (q36, Pete 2026-06-22). A SINGLE dynamic page pool (a resident page_owner[] allocator in section D, boot-sized from PRAMTP) shared by the editor AND the assembler: any subsystem alloc_page/free_page; a requester that can't get a page raises its own out-of-memory error. Supersedes the assembler's hardcoded off-axis pages 4-15 and FOLDS the i23 96KB-IN / i24 32KB-OUT ceilings into the pool. 256KB is FIRST-CLASS (~144KB doc ceiling; ~9 free pages); 512KB ~25 free pages. Pool exhaustion = refuse-with-message (the honest ceiling) — page persistence/SPILL is a DOWNSTREAM feature (depends on i2, never blocks it). Lazy edit/assemble spill: DOC blocks serialize to disk only when FREE can't satisfy an alloc, and only as many as needed (§4.5) — a 512KB machine touches disk zero times. IDE owns allocation for its session (rebuild BASIC ALLOCT only on exit). Spec: docs/specs/ide-memory-model-design.md. Implements the pool i41 §5.2 already assumes; lifts i23/i24 for free.
  status: DONE
  kind: umbrella
  owner: agent
  refs: [docs/specs/ide-memory-model-design.md, i41, i23, i24]

- id: i2a
  title: "Page allocator core: page_owner[] + alloc_page/free_page (Go authority + Z80 port, host-verified)"
  description: |
    First brick of i2. The resident page allocator mechanism (spec §4.1): a page_owner[] byte-per-page ownership table (RESERVED/FREE/owner-tag), alloc_page(owner)->page|FAIL (first-FREE policy), free_page(page,expected_owner) with tag assertion, plus pp_init/pp_reserve/pp_owner_of/pp_free_count. Go authority tools/sam-aarch64/pagepool + Z80 port src/pagepool.asm, host-verified vs an oracle via the koron-go/z80 harness (mirrors the i41d Brick-1 pattern). Does NOT yet wire IN/OUT/DOC buffers to the pool (§4.4) nor read sysvars for boot-sizing (§4.2) nor add the boot self-test on the paged path — those are later i2 bricks. Spec: docs/specs/ide-memory-model-design.md.
  status: DONE
  kind: leaf
  owner: agent
  prs:
    - {num: 591, role: completing}
    - {num: 591, role: completing}
  parent: i2

- id: i2b
  title: "Wire the page pool into the production assembler boot path: boot-time sizing + resident pool + paged boot self-test"
  description: |
    Second i2 brick (after i2a's standalone allocator). Makes the pp_* allocator LIVE in the production assembler: at boot, read PRAMTP to size the pool (pp_init marks [0,count) FREE, [count,32) absent), then RESERVE pages 0..15 — the base 256KB the current system occupies (0..3 BASIC/system/screen/DOS, 4 ENCTAB, 5..6 OUT, 7..12 IN, 13..14 payloads, 15 disasm), leaving expansion RAM (16..PRAMTP on a >256KB machine) as the FREE pool. The page_owner[] table is resident in section D (PP_TABLE_BASE). A boot self-test on the PAGED boot path (claim-all/free-all round-trip; reserved pages never move; spec §6) runs OFF-AXIS in the page-12 cluster (test_pagepool.asm) to stay out of the tight section-C test-variant budget; exercised by the harness TestBootSelfTestsPass + the SimCoupe matrix. The harness seeds PRAMTP=0x1F (emulation-first: model the ROM-set sysvar). ADDITIVE: does NOT migrate any buffer to the pool (the static pages 0..15 stay in use), so the self-test never writes pool-page contents — marking an expansion-RAM page FREE is safe here. The precise DOSFLG/VMPR survey (reserving the real DOS/screen pages, incl. any DOS in expansion RAM) and the NEW-BASIC reclaim are the CONSUMER bricks' responsibility (i23/i24 + the IDE shell), required before anything WRITES to a pool page. Spec: docs/specs/ide-memory-model-design.md §4.2/§6.
  status: DONE
  depends_on: [i2a]
  kind: leaf
  owner: agent
  prs:
    - {num: 593, role: completing}
  parent: i2

