- id: i114b
  title: "Netboot storage-allocation strategy: header policy (first-free / fixed-list / highest-free)"
  description: |
    design §4: storage-allocation policy in the manifest header (front section), user-chosen, default highest-free. s1 first-free (pack already-claimed records then lowest free), s2 fixed-list (overflow WARNS, never steals an unlisted record), s3 highest-free (keep low slots for the user's own disks). Invariants: overflow is an explicit warning, never a silent record-steal; the header records whether the manifest's own disk is in the pool; resume reuses already-claimed space. Go authority over a modelled store; host-verifiable.
  status: OPEN
  kind: leaf
  owner: agent
  parent: i114
  refs: ["docs/specs/netboot-storage-manifest-design.md §4"]

- id: i114c
  title: "Netboot storage classes: flat-file vs trinity-sam-disks bootable raw-record (validate + HWSAD write seam)"
  description: |
    design §6.5 decision 5: store a fetched object as one of two classes by explicit namespace prefix (never inferred). default = flat-file archive (spanned per §3, never bootable). trinity-sam-disks/ prefix = SAM disk record: validate-before-commit (size==819200 AND BDOS stamp@byte232), reject on mismatch; a raw record is both bootable (HRECORD+boot) and servable-raw. Raw-record write seam: HWSAD (hook 149) per-sector write of the 1600-sector image, modelled in BDOSStore symmetric to HRSAD; SD write dispatch hardware-gated like HSAVE. Validation+dispatch host-verifiable. Unblocks i122.
  status: DONE
