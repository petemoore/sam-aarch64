- id: i23
  title: "Paged-IN HLOAD-ceiling lift (current ceiling: 96 KB = 6 pages 7..12, src/assembler.asm:49)"
  description: |
    Lift the IN-file 96KB ceiling by migrating the IN buffer to the i2 page pool. DESIGN (Pete 2026-06-23, option A): CONTIGUOUS-RUN, not non-contiguous scatter — SAMDOS HLOAD/HSAVE are contiguous-only (no seek/scatter; ldblk samdos c.s:575 + ctas c.s:318-374), so IN is allocated as one contiguous run via a new pp_alloc_run pool primitive. Reader hot-path inner loop (in_normalise_hl inc-advance + reader_next_kind copy) stays UNCHANGED; only the base page becomes a runtime var (IN_BASE_LMPR). No in_pages[] scatter. Pieces: (1) pp_alloc_run/pp_free_run (Go authority pagepool.go + Z80 pagepool.asm + harness test); (2) pool_boot frees IN pages 7..12 into the pool (reserve 0..6 + 13..15) + update i2b self-test; (3) dynamic base in reset_reader/reader_init/load_in_file; (4) load_in_file allocs the run (head-page alloc -> decode prefix size -> free -> alloc run_size -> HLOAD; fail_with_tag on no-fit, replacing the cp 7 bound). Ceiling = largest contiguous free run (256KB on 512KB SAM via 16..31; 96KB on 256KB unchanged, accepted under A). Verify: regression (base stays 7 for <=6 pages) + pp_alloc_run fragmented unit test + >96KB harness integration test (base lands at 16) + release-gate + SimCoupe. Plan: docs/plans/i23-in-pool-contiguous.md. True scatter loader deferred (Pete chose plain A).
  status: DONE
  depends_on: [i2a, i2b]
  kind: leaf
  owner: agent
  prs:
    - {num: 595, role: completing}

