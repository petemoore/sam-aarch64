- id: i137
  title: build-disk netboot ceiling check doesn't distinguish section class (i125 follow-up)
  description: |
    tools/build-disk/main.go rejects netboot image only if it loads past &10000 (≤32768 bytes). A section-C bootable (smoke/serve/server/client) must fit &8000-&BFFF (≤16384); above that it loads into ROM1 at boot and crashes. Mostly masked: the per-program make fit-check (i125, 16384 for section-C) fires first, so an over-section-C binary never reaches build-disk normally. Gap only reachable by calling build-disk -netboot directly on an over-section-C image. Fix needs a -netboot-section-c flag threaded through disk targets. Low priority (masked by i125 gate).
  status: OPEN
  kind: leaf
  owner: agent
  refs: [tools/build-disk/main.go, tools/netboot-boot-fit-check.sh, i125, i119]

- id: i138
  title: "Emulator keyboard-input support: stub LASTK/FLAGS/KSTATE sysvars to feed keypresses without interrupts"
  description: |
    The Go/koron-z80 harness never fires interrupts or models the keyboard, so a program awaiting a keypress (the i119 record-selection UX) can't run in emulation. Cheap approach (Pete's pointer): stub the keyboard sysvars the interrupt populates — LASTK (0x5C08) / FLAGS bit 5 (new-key) / KSTATE — inject keys directly, bypassing 50 Hz interrupt + key-matrix decode. Precedent: BASIC ROM-emulation spike (blob c0f62fa) intercepts LASTK/FLAGS to feed a key queue; samfile's etunes uses a port-level stub. Full interrupt emulation is the heavier fallback. Foundation for editor-era input (i48c/i41).
  status: DONE
