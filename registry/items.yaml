    TOP PRIORITY next session, gated on Pete being present (culminates in a hardware stripes test, i230, that needs Pete at the SAM). Stage 1 of the i135c no-brick plan. Build the patched bootblock with a WORKING boot screen and emulation-verify it. The full implementation recipe (from the 2026-06-23 ROM research) is in docs/plans/i229-combined-bootblock.md: the rainbow stripes are rendered LIVE by the ROM line-interrupt ISRs (FRAMINT/LINEINT), not by the &ED1B data write — so the routine must establish IM1+EI + arm STATPORT, clear paper+border to CLUT index 0 (LINEINT drives CLUT reg 0 per scan line; border is a CLUT-index lookup so both track it), build LINICOLS (the verbatim &ED1B port already in samboot_stripes), set the print position via CLSLOWER &06B5 (channel K — fixes the top-left banner), print the banner (UTMSG &3DB0 + the &0F7F é/size tail), then EI, wait-for-key, teardown (LINICOLS[0]=&FF), and RETURN CLEANLY (never di;halt — trinload's try_exec pushed its own start, so a clean RET restarts trinload; the prior yellow-screen run hung because the di;halt path / wrong paging executed). STATE 2026-06-23: a stripes+banner DEMO (mgt_screen_demo, the &ED1B DATA write only) is committed + emulation-verified but it showed FLAT YELLOW on hardware precisely because it omits the interrupt setup — that is the gap this item closes. Also assemble the full chunk-1 image (Colin's proprietary bootblock from the local eeprom.bin + the inject, via a splice tool, NOT committed bytes) and reset-chain-verify (samboot_real_boot_test.go boots the real rom.bin from address 0). Build with fresh context; do not rush boot code (prime directive).
