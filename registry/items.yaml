- id: i118
  title: i82 TFTP client — OACK handling / standard-TFTP-server interop
  description: |
    The i82 client requests RRQ options (blksize/tsize/timeout/windowsize) but has no OACK (opcode 6) handling. A standards-compliant server (e.g. macOS tftpd) answers an optioned RRQ with OACK before DATA; the client ignores it, never ACKs block 0, and hangs. Fix: on OACK -> learn server endpoint + adopt negotiated blksize (512 default if absent) + send ACK block 0; on direct DATA -> 512 default (today's hard-coded 1428 truncates); drop windowsize from request. Mirrored in Go authority + host tests. PR #422 landed the Go/Z80/host side; hardware test pending.
  status: OPEN
