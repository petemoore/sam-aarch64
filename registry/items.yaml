- id: i125
  title: Section-C fit gate for every bootable netboot program (build + CI)
  description: |
    A bootable netboot program loads at &8000; &C000-&FFFF is ROM1 at boot, so code/data above the budget is never written to RAM (the i119 over-size class). Generalised the down-payment client check to all *_boot.bin targets via shared script tools/netboot-boot-fit-check.sh: smoke/serve/server/client gated to 16384 (section C), http to 32768 (section-D overlay per phase3-delivery-design.md §13.1). Wired into CI by adding netboot-server-boot + netboot-serve-boot to ci-netboot-z80 so an over-size bootable image fails CI, not hardware.
