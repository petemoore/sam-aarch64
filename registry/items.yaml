- id: i48c-b8e
  title: "Compact encoder adapter: literal-probe + overlay-patch emission (paged, needs ENCTAB)"
  description: |
    Port the encoder-dependent half of assemble.Compact. SCOPE FINDING (2026-06-22 investigation): this is the LARGEST B8 brick and the architecturally most significant — the SAM gains its FIRST standalone instruction-encode capability. The Z80 has NEVER encoded a symbolic INST record from scratch; today it only FOLDS pre-computed base words (host produces base words via Go encodeInst; the Z80 insn_run.asm pass2 folds {slot,expr} patches). For text->.tbn on the SAM, the SAM must encode. So b8e ports ~800 LOC of NEW Z80: (1) encodeInst dispatch (pass2.go:214-373 + operandsToValues: operand-kinds -> form -> slot values -> base word, incl. the special-form intercepts lsl/lsr/bitfield/bic-imm/csetm/barriers/ror/mrs-msr/dc-tlbi + compound mem/shifted/extended forms); (2) overlayClassify (overlay.go:82-163: the encodeInst mirror that returns {relocated-slot, expr} instead of emitting); (3) literalWord (compact.go:354-370: encode at pcProbeA=0 and pcProbeB=0x40000; equal => bare 4-byte literal element). REUSES (already proven in pass2): the 13 slot folders (insn_run.asm fold_*), the per-slot encoders (src/slots/*.asm), form_lookup (form_lookup.asm), eval_expr_const, the symbol/local tables. HARNESS: flat is IMPOSSIBLE (needs the paged ENCTAB + form_lookup + slot encoders = the whole assembler). Use a BUILD_TESTS boot self-test inside the full paged assembler build (precedent: assembler.asm:357-468 self-tests; test_mem_offaxis.asm off-axis pattern), where ENCTAB is already mapped by main_assemble's enctab_map_in bracket; the Go harness synthesises a fixture, the self-test runs the encoder, the Go side compares vs host encodeInst/overlayClassify. SimCoupe-gated (it's in the assembler build). Likely deserves a short spec + possible further decomposition (encodeInst dispatch / overlayClassify / literalWord+wiring) at session start. Go authority: pass2.go encodeInst+operandsToValues, overlay.go overlayClassify, compact.go literalWord.
  status: OPEN
  depends_on: [i48c-b8b, i199, i203, i201, i204]
  kind: leaf
  owner: agent
  parent: i48c-b8

