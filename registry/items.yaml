- id: i114
  title: Netboot serve manifest + record-allocation strategy
  description: |
    A manifest on the booted record maps TFTP names/paths -> B-DOS records, decoupling the served namespace from B-DOS 10-char flat filename limits. Entries carry {locator(s), span count, size, optional SHA-256}. Storage-allocation strategy in manifest header (first-free / highest-free / fixed-list; never silently steal a record). Multi-project use with shared-files-by-reference. Sub-choices settled: encoding=text, locator key=number+name, span naming=hash-derived, default=highest-free. Storage-class: trinity-sam-disks/ prefix = validated raw-record disk. Design at §6.5.
  status: OPEN
  kind: umbrella
  owner: agent
  refs: ["docs/specs/netboot-storage-manifest-design.md §6.5", i93, i95, i99, i70, i100, i101, i119, i122]

- id: i114a
