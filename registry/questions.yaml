- id: q48
  body: |
    OPEN (Pete still considering, 2026-06-23): how should the SAM assembler treat .section / named-section layout? FINDING (verified this session): on the SAM/non-flatten path, .section (and .text/.data section-switches) are zero-byte directives — they ROUND-TRIP faithfully (text->.tbn->text via render/pc.go:200; the .tbn stores them as DIRECTIVE records) but have NO effect on byte placement, because the SAM target is flat single-.org with no linker (the host -flatten path consumes/strips sections per flatten.go:86-102). So a from-scratch on-SAM project is NOT locked to spectrum4's layout (place with .org), but a .section directive looks meaningful while being placement-inert. DECISION FOR PETE: (a) keep 'preserved-but-inert' as-is (nothing broken; .section round-trips like a comment); (b) make the authoring path WARN when a .section switch appears so the author knows it won't relocate (preserve for round-trip, just surface it); or (c) add REAL named-section / linker-style placement on the SAM so .section becomes load-bearing (large feature; overlaps q46/i32 multi-source). Pete asked to keep this open; he will revisit. Do NOT change .section behaviour until Pete decides — erroring/stripping would break the existing round-trip.
  owner: pete

- id: q49
  body: |
    i73 L12: .set/.equ redefinition semantics diverge between the Go authority and the Z80 assembler. The Go authority (tools/sam-aarch64/assemble/pass1.go resolveEquDirective, ~line 382) SILENTLY OVERWRITES on redefinition — res.Symbols[name]=v unconditionally, only skipping the usage-counter bump on a dup, matching GNU as where .set may reassign a symbol's value. The Z80 side (main_loop.asm main_dir_equ_do_insert -> symbols.asm symbol_insert) does jp fail on any duplicate id. Making the Z80 faithful to Go is a real BEHAVIOUR change, not a decision-free guard: the paged SYMTAB symbol_insert is insert-only (a redefine needs a lookup-and-overwrite path), and the two-pass model raises a genuine question — which value wins across pass 1 vs pass 2 for a symbol redefined mid-file, and must a forward reference between two .set's of the same name resolve to the pre- or post-redefinition value? No current release/fixture redefines a .set (the release byte-match is unaffected either way), so there is no test forcing the answer. Decision needed: (a) keep the hard duplicate-fail (current Z80 behaviour; diverges from Go/GNU but is safe), or (b) implement last-wins .set redefinition faithful to Go, defining the two-pass tie-break. Until decided, L12 is left unfixed; the other five i17 L-residuals (L3/L4/L5/L10/L11) are fixed in the i73 hardening PR.
  owner: pete

- id: q50
  body: |
    i229 patched-bootblock — design forks to settle WITH Pete (brick-adjacent boot code he reserved for his presence; eeprom.bin chunk-1 disassembled + Go harness mapped this session). (1) SPLICE DESIGN (proposed, elegant): change CALL &805F @&409E (bytes CD 5F 80, file off &9E) to CALL inject; inject lives in the 674-byte free space &415E..&43FF and does: call &805F (real DOS init); call samboot_read_config; ret nc (no-auto-boot -> returns to &40A1 = the self-modified restore:, which is preserved VERBATIM); ld a,l / ld (BD_BOOT_RECORD),a / jp bdos_boot_record (ALHK). Only 3 bytes change at &409E; restore: + screen tail untouched. OK? (2) CONFIG READ: Colin's bootblock has read_chunk BY-NUMBER (&40BD) but NO find_index (by-name). samboot_config.asm reads BY-NAME via find_index + a 1024-byte 'chunk' scratch buffer — that buffer does NOT fit the 674 free bytes and needs a home in RAM post-B-DOS-load. Options: (a) by-name (robust, find_index+1024B buffer somewhere in RAM — where is free post-load?), (b) by-NUMBER reusing Colin's &40BD into a scratch page (smaller, but fixes the config chunk number). Which, and where does the 1024B buffer live? (3) VERIFICATION SCOPE: the emulation reset boot HALTS inside B-DOS init — CALL &805F does NOT return in the current Go emulator (TestRealBootLoadsBDOSCoherently ends finalPC>&8000, never reaches &40A1). So the reset-chain test can only assert the patched chunk-1 LOADS + runs coherently to &805F (12 chunk loads, like the existing test) + the decision logic via the symbol-driven samboot_inject_test.go; the IN-CHAIN post-&805F decision + the stripe PIXELS are left to the i230 hardware RAM test. Is that the accepted emulation scope (consistent with i232 'don't block bootblock work on boot-from-0 emulation'), or should the emulator be taught to complete B-DOS init so &805F returns (i126 slice) before building? Full research: docs/plans/i229-combined-bootblock.md.
  owner: pete

- id: q51
  body: |
    i41e editor edit-model — partial/invalid-document serialize UX (the 'sharpest' open point, flagged '→ qN' in docs/specs/editor-edit-model-design.md §8.4 but never tracked). When the edit-model holds the i48-IR record payload, a document can contain raw/in-progress or invalid/error lines. The existing Compact/Pass1 encoder assumes a FULLY-resolvable assembly and errors otherwise (i41c ships fail-loud: SerializeTBN refuses any incomplete/invalid doc). i41e needs your product-UX call on how a document containing raw/error lines saves to .tbn: (a) REFUSE to save until the whole document is valid (the i41c fail-loud default — simplest, safest, but can't save WIP); (b) save VALID-LINES-ONLY (drop/skip raw/error lines — lossy, surprising); (c) save raw TEXT + error records alongside the encoded valid records (lossless WIP round-trip, needs a .tbn raw/error record variant + a format.Record sum-type wrapper — most work). This is an editor-UX product choice, not a mechanical port, so it gates i41e (CLAUDE.md spec-gate + 'Go-already-implements-it' does NOT apply — there is no Go authority for this). Related design surface that follows from the choice (agent design, not Pete): the hybrid record sum type (§8.2/§7.3), incremental symbol-table name-id lifecycle + name-id<->record-id side-tables (§8.1/§8.5), and per-line text->IR validation semantics (§8.3). Recommend (a) fail-loud as the interim and likely default unless you want WIP-save. Context: docs/specs/editor-edit-model-design.md §8.
  owner: pete

- id: q52
  body: |
    i42 .tbn integrity field — format-evolution decision (on the v2 'Format B' format you designed via i39). Add a CRC/checksum/signature so a corrupted .tbn is detected, not silently mis-assembled. Your calls before autonomous implementation: (a) PRIMITIVE — CRC-16 (cheap on Z80, ~adequate for accidental corruption), CRC-32 (stronger, more T-states + 4 bytes), or a real signature (overkill for accidental corruption; only if tamper-detection matters)? (b) PLACEMENT + VERSION — a new fixed field in the v2 header (bumps the format version + touches every fixture + the release-gate/disasm-roundtrip byte-match gates), or an optional/appended trailer that old readers ignore (back-compatible, no version bump)? (c) COVERAGE — checksum the whole file, or just the record stream (excluding the integrity field itself)? (d) SAM-SIDE COST — verify-on-load costs T-states proportional to file size on real hardware; is detection worth that on every load, or verify-on-demand/optional? Recommend: CRC-32 over the record stream in an appended trailer (back-compatible, no fixture/gate churn), verified on load (the reader already streams the file). Context: docs/specs/tbn-binary-format-reference.md, docs/specs/compact-tbn-nextgen-design.md (i39 Format B).
  owner: pete

- id: q53
  body: |
    How should the registry disposition long-deferred / already-declined items that keep surfacing at the 'build/registry ready' tip and forcing per-session judgment calls (and premature wind-downs)? Concrete cases: i55 (multi-section/linker-script in refenc — 'explicitly punted in favour of -flatten; only if a non-spectrum4 project surfaces', and q42 chose the -layout struct over a .ld parser) and i66 (Trinity page-persistence — q9 resolved 'no value implementing right now; revisit if a concrete need appears'). Both are OPEN+owner:agent, so they sit at the ready tip every session though neither is agent-actionable now. Options: (a) WONTFIX them now (reopenable when the triggering condition appears) — enacts the already-made decisions; (b) add a 'DEFERRED' status distinct from OPEN/WONTFIX that 'ready' excludes; (c) re-own to owner:pete (needs a set-owner verb — none exists today) so 'ready' excludes them by default; (d) leave as-is. i103's quiescent hold already stops the restart-loop when the queue is all-deferred, but the items still need an honest disposition. Agent recommends (a) for i55/i66 specifically (both backed by resolved questions), and notes (c) needs a CLI 'set-owner'. Pete's call.
  owner: pete

