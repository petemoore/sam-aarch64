# Registry questions — generated by `registry` CLI; source of truth.
# Spec §"Questions — transient by design".

- id: q13
  body: |
    **Editor default rendering config** (i76 / editor-rendering-rules-design.md §10) — which look does the on-SAM editor ship as its default (user-overridable)? Rules §3–§9 specified (config lab is authority); 64 cols fits only 76% of comments uncompressed. Choosing baseline-clean vs compressed-dense vs chromeless is a taste call against real PNGs / SimCoupé SCREEN$. Agent recommends tuned compressed.config: adaptive mnemonic col, &-immediates, stripped registers, label-truncate 16, sameline comments, wrap:3, max-width 40. Non-blocking — any answer is a one-line resolution + default config file.
  owner: pete

- id: q22
  body: |
    **Pin the Brick-7 record cap (HSAVE staging-buffer RAM budget) on real Trinity hardware.** q18 resolved (Pete: build Brick 7 speculatively), so the build uses a provisional equ for the record cap, marked 'confirm on hardware.' The Go authority bdos/span.go deliberately refused to bake this. Bench the real B-DOS HSAVE persist on Trinity, confirm/adjust the cap — a one-line change (decoupled by design). Shipped value: FW_RECORD_CAP = 4096 (src/netboot/http_main.asm, i100b/PR #373) — largest file fits 1000-record/3-digit-index bound, bootable fits under &10000.
  owner: pete

- id: q23
  body: |
    **The i101 capstone orchestration UX — how are the boot→fetch→assemble→serve phases sequenced?** The three layers all org &8000 and cannot co-reside; they run as sequential overlays via the Trinity B-DOS store (design §13.1–13.2). Product choice: (a) auto-sequencing disk detecting provisioning state, chains fetch→assemble→serve (needs orchestrator + chain-load); (b) three separate single-purpose disks in order; (c) one disk with boot menu. Agent leans (a) with (b) as fallback. Non-blocking: components built; real chained boot is hardware-gated (§13.3); no i100c picker needed under any model.
  owner: pete

- id: q24
  body: |
    **How should the on-SAM editor serialize a document that is NOT a complete valid assembly?** (i41e — editor-edit-model-design.md §8.4.) Three product behaviours: (a) refuse to save until valid (i41c fail-loud — loses WIP on crash); (b) save valid lines only, dropping invalid (data-lossy); (c) persist raw text + error records for invalid lines (§7.3 hybrid — lossless round-trips; only assembly requires validity). Agent leans (c) for document persistence with (a) fail-loud for assemble-to-.tbn. Non-blocking: i41c ships fail-loud; i41e needs this answer before its hybrid-record design.
  owner: pete

- id: q25
  body: |
    **Should we investigate CIIP — a pre-existing Z80 TCP/IP stack — as prior art for the SAM netboot stack (i83 TFTP, i70 HTTP, i86 DHCP)?** Surfaced by i113 discovery (2026-06-17): CIIP is CPC-originated (author OCR-damaged — photo-verify IMG_20260617_163218) reportedly providing TFTP/HTTP/DNS servers + clients; Simon Owen ported it to pyz80. Phase-3 is building exactly those servers; CIIP could be prior art. Task: locate code, assess license/portability, weigh 'adapt CIIP' vs 'continue i82/i83/i86 path'. UNVERIFIED — OCR-derived; do not treat capabilities as established until photo-confirmed.
  owner: pete

- id: q30
  body: |
    Remote-push (i121 WRQ) safety model: i119 makes an interactive show-name + y/n confirm MANDATORY before any HSAVE, but an unattended 'tftp put' has no operator at the SAM keyboard (the confirm spins forever). Is 'write-to-FREE-record-only' sufficient safety (auto-pick a free record; TFTP ERROR(3) if none free; never overwrite a named record - satisfies the shared-resource invariant without a keyboard), or must remote pushes be operator-armed (boot-time 'pushes allowed' pre-confirm)? Gates i121c (the write brick). Plan: docs/plans/i121-wrq-server.md.
  owner: pete
