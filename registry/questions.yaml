- id: q48
  body: |
    OPEN (Pete still considering, 2026-06-23): how should the SAM assembler treat .section / named-section layout? FINDING (verified this session): on the SAM/non-flatten path, .section (and .text/.data section-switches) are zero-byte directives — they ROUND-TRIP faithfully (text->.tbn->text via render/pc.go:200; the .tbn stores them as DIRECTIVE records) but have NO effect on byte placement, because the SAM target is flat single-.org with no linker (the host -flatten path consumes/strips sections per flatten.go:86-102). So a from-scratch on-SAM project is NOT locked to spectrum4's layout (place with .org), but a .section directive looks meaningful while being placement-inert. DECISION FOR PETE: (a) keep 'preserved-but-inert' as-is (nothing broken; .section round-trips like a comment); (b) make the authoring path WARN when a .section switch appears so the author knows it won't relocate (preserve for round-trip, just surface it); or (c) add REAL named-section / linker-style placement on the SAM so .section becomes load-bearing (large feature; overlaps q46/i32 multi-source). Pete asked to keep this open; he will revisit. Do NOT change .section behaviour until Pete decides — erroring/stripping would break the existing round-trip.
  owner: pete

- id: q51
  body: |
    i41e editor edit-model — partial/invalid-document serialize UX (the 'sharpest' open point, flagged '→ qN' in docs/specs/editor-edit-model-design.md §8.4 but never tracked). When the edit-model holds the i48-IR record payload, a document can contain raw/in-progress or invalid/error lines. The existing Compact/Pass1 encoder assumes a FULLY-resolvable assembly and errors otherwise (i41c ships fail-loud: SerializeTBN refuses any incomplete/invalid doc). i41e needs your product-UX call on how a document containing raw/error lines saves to .tbn: (a) REFUSE to save until the whole document is valid (the i41c fail-loud default — simplest, safest, but can't save WIP); (b) save VALID-LINES-ONLY (drop/skip raw/error lines — lossy, surprising); (c) save raw TEXT + error records alongside the encoded valid records (lossless WIP round-trip, needs a .tbn raw/error record variant + a format.Record sum-type wrapper — most work). This is an editor-UX product choice, not a mechanical port, so it gates i41e (CLAUDE.md spec-gate + 'Go-already-implements-it' does NOT apply — there is no Go authority for this). Related design surface that follows from the choice (agent design, not Pete): the hybrid record sum type (§8.2/§7.3), incremental symbol-table name-id lifecycle + name-id<->record-id side-tables (§8.1/§8.5), and per-line text->IR validation semantics (§8.3). Recommend (a) fail-loud as the interim and likely default unless you want WIP-save. Context: docs/specs/editor-edit-model-design.md §8.
  owner: pete

- id: q52
  body: |
    i42 .tbn integrity field — format-evolution decision (on the v2 'Format B' format you designed via i39). Add a CRC/checksum/signature so a corrupted .tbn is detected, not silently mis-assembled. Your calls before autonomous implementation: (a) PRIMITIVE — CRC-16 (cheap on Z80, ~adequate for accidental corruption), CRC-32 (stronger, more T-states + 4 bytes), or a real signature (overkill for accidental corruption; only if tamper-detection matters)? (b) PLACEMENT + VERSION — a new fixed field in the v2 header (bumps the format version + touches every fixture + the release-gate/disasm-roundtrip byte-match gates), or an optional/appended trailer that old readers ignore (back-compatible, no version bump)? (c) COVERAGE — checksum the whole file, or just the record stream (excluding the integrity field itself)? (d) SAM-SIDE COST — verify-on-load costs T-states proportional to file size on real hardware; is detection worth that on every load, or verify-on-demand/optional? Recommend: CRC-32 over the record stream in an appended trailer (back-compatible, no fixture/gate churn), verified on load (the reader already streams the file). Context: docs/specs/tbn-binary-format-reference.md, docs/specs/compact-tbn-nextgen-design.md (i39 Format B).
  owner: pete

