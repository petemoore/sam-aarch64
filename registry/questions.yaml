- id: q60
  body: |
    i215c spill-backend STORAGE DESIGN — the concrete SpillBackend (Store/Load/Discard a serialized DOC block by id) needs a storage architecture the spec (ide-memory-model-design.md §4.5/§5/§7) explicitly DEFERS ('spill is a downstream feature, not i2'). i215a modelled only an in-memory FAKE backend; i215b ported only an in-RAM SP_BACKSTORE placeholder. Before the concrete Trinity/floppy backend (i215c) can be implemented faithfully, please decide (several have DATA-SAFETY implications, so I won't guess — prime directive + the shared-resource 'never clobber' invariant): (a) TRINITY RECORD SELECTION — which record(s) does spill use? A free record claimed via bdos_find_free_record (safe: never touches named records; but competes with TFTP push for free slots), highest-free like push, or a dedicated reserved 'SPILL' record? (b) BLOCK->LOCATION MAPPING — how are many DOC blocks (BlockID uint32) laid out in backend storage? One spill record holding blocks at fixed sector offsets by slot (block slot i -> sectors [i*k..]; needs a slot table), or one record per block (uses many records)? (c) SESSION PERSISTENCE — does the spill store persist across boots/sessions or is it scratch reclaimed each boot? Does spill name/claim its record (B-DOS list entry) or use it unnamed-scratch? (d) SPILL vs PUSH CONTENTION — if both use free records, what's the policy (e.g. push lowest-free, spill highest-free; or spill reserves one record up front)? (e) FLOPPY/TAPE BACKEND — the fallback when no Trinity is UNSPECIFIED entirely: file format/naming (one SAVE'd file per block named by id? a tape catalog?), or is floppy spill out-of-scope for v1 (Trinity-or-refuse MVP — the HARD constraint is only 'runs fully WITHOUT Trinity', i.e. refuse-with-message, not 'spills to floppy')? Recommendation if you want a default: v1 = Trinity-only, claim ONE free record up front as a named 'SPILL' scratch (shared-resource-safe), blocks at slot*K sector offsets, scratch (not persisted across boots); floppy deferred to a later item; refuse-with-message when no Trinity. Blocks i215c (and its split shape depends on the answers).
  owner: pete

