- id: q13
  body: |
    **Editor default rendering config** (i76 / editor-rendering-rules-design.md §10) — which look does the on-SAM editor ship as its default (user-overridable)? Rules §3–§9 specified (config lab is authority); 64 cols fits only 76% of comments uncompressed. Choosing baseline-clean vs compressed-dense vs chromeless is a taste call against real PNGs / SimCoupé SCREEN$. Agent recommends tuned compressed.config: adaptive mnemonic col, &-immediates, stripped registers, label-truncate 16, sameline comments, wrap:3, max-width 40. Non-blocking — any answer is a one-line resolution + default config file.
  owner: pete

- id: q45
  body: |
    i24 OUT-ceiling lift — emit_byte hot-path design fork. HSAVE/HLOAD are contiguous-only (samdos c.s:575/318-374), so lifting OUT past 32KB forces the WHOLE OUT buffer into ONE contiguous pool run sized from the pass-1 total. That collides with the 'free low-zone' optimization: today page 5 = LMPR_ENCTAB+1, so the first 16KB of OUT writes land in section B with NO LMPR bracket (paged-out-design.md); a large pool run can't start at page 5 (it would run into IN at 7+), so it loses that free path. OPTIONS: (A) UNIFORM — whole OUT is a pool run, every emit_byte brackets LMPR like today's high-zone (simplest; loses free-low-zone for the common <=16KB case; per-byte bracket = a few T-states/byte, negligible on a one-shot assemble). (B) TWO-MODE — keep the static page5/6 32KB scheme (free-low) for outputs <=32KB and a pool run only for >32KB (preserves common-case perf but doubles the emit_byte path + needs section-C budget we lack). Agent recommends (A). Pete cares about T-states (the OUT path) — hence the ask. NOTE: i24 is ALSO budget-blocked (i23 left 13 B test-variant headroom); see the commoning-pass item.
  owner: pete

- id: q46
  body: |
    i32 (multiple source files + staged/partial loading) — what is the intended SHAPE? This is a 'beyond-M7 future idea' with no settled approach, and several design forks need your call before autonomous implementation: (a) how do multiple files combine — textual concatenation in a fixed order, an .include-driven single translation unit (we already have .include), or separate compilation + a link step over multiple object/.tbn units? (b) 'staged/partial loading' — is this about assembling a project too big to hold all source in RAM at once (stream files through the i2 pool), or about incremental re-assembly of only changed files? (c) does this supersede or overlap i33 (Trinity-backed staged/overlaid assembly) — should they merge? Recommend scoping once the IDE/pool (i2) lands, since staged loading depends on the pool's spill story (i215). No agent design until the shape is chosen.
  owner: pete

- id: q48
  body: |
    OPEN (Pete still considering, 2026-06-23): how should the SAM assembler treat .section / named-section layout? FINDING (verified this session): on the SAM/non-flatten path, .section (and .text/.data section-switches) are zero-byte directives — they ROUND-TRIP faithfully (text->.tbn->text via render/pc.go:200; the .tbn stores them as DIRECTIVE records) but have NO effect on byte placement, because the SAM target is flat single-.org with no linker (the host -flatten path consumes/strips sections per flatten.go:86-102). So a from-scratch on-SAM project is NOT locked to spectrum4's layout (place with .org), but a .section directive looks meaningful while being placement-inert. DECISION FOR PETE: (a) keep 'preserved-but-inert' as-is (nothing broken; .section round-trips like a comment); (b) make the authoring path WARN when a .section switch appears so the author knows it won't relocate (preserve for round-trip, just surface it); or (c) add REAL named-section / linker-style placement on the SAM so .section becomes load-bearing (large feature; overlaps q46/i32 multi-source). Pete asked to keep this open; he will revisit. Do NOT change .section behaviour until Pete decides — erroring/stripping would break the existing round-trip.
  owner: pete

- id: q49
  body: |
    Per docs/specs/tbn-header-integrity.md §7: adding a CRC-32 integrity field to the .tbn header. Decision: (a) hard version bump w/ mandatory CRC (old files need back-compat); (b) keep v2 + new FlagHasCRC flag bit, additive so old files stay valid (RECOMMENDED, least disruptive); (c) always write CRC, verification opt-in. Pete picks; then i42 implements.
  owner: pete
