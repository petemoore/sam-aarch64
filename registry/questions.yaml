- id: q57
  body: |
    i106 (SAM-as-terminal: SSH/telnet client to your Mac over the LAN) -- go/no-go + security posture before any autonomous implementation. No Go authority implements SSH, so this is a NEW design+security+product decision, not a port. The sketched 'sweet spot' is a deliberately-WEAK KEX-stub SSH: send a constant X25519 basepoint as the client ephemeral pubkey and use the server's received pubkey as the shared secret (zero EC math, instant connect, interoperates with stock OpenSSH sshd), SKIPPING host-key verification. That trades away essentially all confidentiality/integrity vs an active attacker (MITM-able, no forward secrecy) for a tiny Z80 footprint -- putting a knowingly-weak SSH client on your home LAN talking to your Mac's sshd. Decisions: (a) PURSUE i106 at all, or is a SAM SSH terminal too niche to spend the budget on right now? (b) SECURITY POSTURE if yes -- (i) the weak KEX-stub as sketched (fast, insecure, fine for a trusted home LAN), (ii) real X25519 from the start (reuses i88 X25519; ~10-min handshake on Z80 per the i106 note but actually secure), with a secure-mode toggle between them, or (iii) TELNET instead (minimal SAM code but needs Homebrew inetutils telnetd on the Mac and is cleartext)? (c) SCOPE -- MODE 3 64x24 terminal, ChaCha20-Poly1305 per-byte at a few hundred B/s; acceptable? Reuses i88 crypto + i70 tcp_conn. Answer to unblock i106 (and a follow-up design spec).
  owner: pete

