- id: q13
  body: |
    **Editor default rendering config** (i76 / editor-rendering-rules-design.md §10) — which look does the on-SAM editor ship as its default (user-overridable)? Rules §3–§9 specified (config lab is authority); 64 cols fits only 76% of comments uncompressed. Choosing baseline-clean vs compressed-dense vs chromeless is a taste call against real PNGs / SimCoupé SCREEN$. Agent recommends tuned compressed.config: adaptive mnemonic col, &-immediates, stripped registers, label-truncate 16, sameline comments, wrap:3, max-width 40. Non-blocking — any answer is a one-line resolution + default config file.
  owner: pete

- id: q35
  body: |
    i122 brick 4 wants 'before fetching, if the content hash is already stored, skip the fetch and boot the existing copy.' Two tensions block a faithful build:
    
    (1) HASH SOURCE: the client fetches by FILENAME over TFTP and has no content hash until it has fetched the bytes; to SKIP a fetch you need the hash FIRST. So it must come from a boot-config field or a name->hash manifest lookup. Which?
    
    (2) STORAGE MODEL: i122c (PR #498) writes the image to a FIXED reused scratch record (i122 note a), NOT content-addressed. i114d's <hash6><NNN> naming is for SPANNED FLAT-FILES, not raw disk records, so a prior fetch-and-boot leaves nothing dedup-findable by hash. Options: (A) store disk images content-addressed (supersedes scratch) -> records ACCUMULATE, needing free-record alloc + the mandatory shared-resource show-name+confirm gate; (B) keep scratch, dedup only against images PROVISIONED via the content-addressed path (i70/i100+manifest) -> boot a provisioned copy directly, else scratch-fetch; (C) a minimal last-fetched-hash cache that only short-circuits an immediate re-boot of the same image.
    
    RECOMMEND (B): dedup checks if the requested image is already on-card under its content-addressed name (prior provisioning, via the i119 list-read scan + i114d naming), boot it without re-fetch; else fetch into scratch (preserves note a). Hash from a name->hash manifest entry (i114). Needs Pete: touches the shared-storage policy he has corrected repeatedly (trinity_storage_shared_resource) and decides whether i122c's scratch model stands. Until answered, any i122d choice is a guess that may contradict storage policy.
  owner: pete

- id: q36
  body: |
    IDE memory-model architecture (i2; design proposal docs/specs/ide-memory-model-design.md). HEADLINE: does the on-SAM IDE adopt ONE dynamic page pool shared by the editor AND the assembler -- a resident page_owner[] allocator + boot-time sizing from PRAMTP that supersedes the assembler hardcoded off-axis pages 4-15 and LIFTS the fixed 96KB-IN (i23) / 32KB-OUT (i24) ceilings -- or does the editor layer a SEPARATE pool on top of the assembler existing static layout (smaller change, but two memory regimes and no IN/OUT lift)? Sub-decisions riding the same answer: (1) minimum target machine -- is 256KB first-class (~144KB document ceiling, hard reliance on evict-on-assemble) or is 512KB the floor? (2) full-document pool exhaustion -- refuse-with-message now + disk-spill deferred (recommended), or is disk-spill in scope for i2? (3) ALLOCT coexistence -- IDE owns allocation outright for its session (rebuild BASIC view only on exit), or keep BASIC ALLOCT consistent for clean mid-session hand-back? RECOMMEND: the unified pool (proposal section 4), 256KB supported but documents smaller, refuse-with-message exhaustion (disk-spill deferred to a tracked follow-up), IDE owns allocation for its session. Rationale: it is the model i41 section 5.2 already assumes (per-block page-list claimed from the i2 pool; i40 evict/reload = free/reclaim), delivers the i23/i24 lifts for free, and matches claim-all-free-RAM-grow-on-demand directly. Needs Pete: this is the foundational editor-era memory direction the handover reserved for his steer before an agent commits foundational decisions.
  owner: pete

- id: q37
  body: |
    i27 Cortex-A53 errata workarounds (--fix-cortex-a53-835769 / -843419) — worth the greenfield cost now? These are LINKER flags spectrum4's Tuprules.tup passes, BUT M6 byte-matches release.bin WITHOUT them — so they are currently NO-OPS for spectrum4's instruction sequences (835769: integer multiply-accumulate followed by a 64-bit ldr/str spanning a page boundary; 843419: adrp at specific page offsets followed by a load). No Go authority exists, so i27 is greenfield (design + Go-first authority + Z80 port + binutils cross-check) — a fresh-session-sized feature. DECISION NEEDED: implement now (future-proofing + correctness on real Cortex-A53/Pi-3 silicon should spectrum4 later add a triggering sequence), or defer/WONTFIX-until-a-real-triggering-sequence-appears (it changes nothing for the current byte-match target)? If implement: scope = both errata? assembler-side 835769 (gas -mfix-...) + linker-side 843419 (ld) — and where in the sam-aarch64 pipeline (it produces a linked release.bin, so linker-stage workarounds belong somewhere)?
  owner: pete

- id: q38
  body: |
    Pursue an on-SAM preprocessor (i31: .if build-constraints + macro expansion) now, and at what scope? Host-side preprocessing already covers this in the current pipeline (asmparse/text2bin), so moving it on-SAM is a new, beyond-M7 feature with genuine scope choices (which .if constraint syntax; macro definition/expansion semantics; integration point vs the existing host preprocess; Go-authority side). Not a port of existing Go authority — needs Pete's go/no-go + scope before a multi-session implementation. Gates i31.
  owner: pete

- id: q40
  body: |
    BD_RECORDS width: replicate Colin's 16-bit cap, or widen to 32-bit for >51GB cards? FINDING (i145e POC, 2026-06-22): Colin's B-DOS 1.5t computes the record count as a full 32-bit divide but stores BD_RECORDS in a 16-bit DVAR (&80C4) — at &A486 only 'push hl' keeps the low 16 bits, so any card whose record count exceeds 65535 WRAPS. Pete's 64GB SDHC -> true 80117 records but stored 14581. The block-count decode is fully 32-bit/correct; only the records STORE caps. AGENT RECOMMENDATION (non-blocking): i145b ports Colin faithfully (16-bit) by default — 65535 x 800KB ~= 51GB is ample for storing a handful of .mgt disk images, and it matches hardware exactly. Widening to 32-bit (a few extra DVAR bytes + wider compare in bdos_find_free_record) is a small, optional future enhancement only needed to use >51GB of a >51GB card. This question only gates the OPTIONAL widening, not i145b's faithful port. Decide if/when we want >51GB addressability.
  owner: pete
