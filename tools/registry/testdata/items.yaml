# Registry items fixture — exercises the dependency-DAG model.
# Spec: docs/specs/registry-source-of-truth-design.md

# i1: umbrella with two leaves; exercises umbrella/leaf semantics.
- id: i1
  title: "Umbrella item (groups i1a and i1b)"
  description: |
    A grouping umbrella. Carries no completing PR of its own;
    DONE only when all children are DONE/WONTFIX.
  status: IN_PROGRESS
  kind: umbrella
  owner: agent
  refs: [i1a, i1b]

# i1a: DONE leaf with completing PR; exercises inv 6 (one completing PR).
- id: i1a
  title: "Done leaf with completing PR"
  description: "Completed sub-task of i1."
  status: DONE
  kind: leaf
  owner: agent
  parent: i1
  prs: [{num: 10, role: completing}]
  refs: [i1]

# i1b: OPEN leaf that depends_on another item; exercises inv 11 (DAG existence).
- id: i1b
  title: "Open leaf gated on i1a"
  description: "Can only proceed once i1a is in place."
  status: OPEN
  kind: leaf
  owner: agent
  parent: i1
  depends_on: [i1a]
  refs: [i1, i1a]

# i2: OPEN leaf that depends_on a question; exercises inv 11 cross-space + inv 13.
- id: i2
  title: "Open leaf gated on a question"
  description: "Decision in q1 must be resolved before this item can proceed."
  status: OPEN
  kind: leaf
  owner: agent
  depends_on: [q1]
  refs: [q1]

# i3: WONTFIX leaf; exercises inv 9 (WONTFIX => reason in description).
- id: i3
  title: "WONTFIX leaf — approach superseded"
  description: "Superseded by i1b; the original approach is not worth pursuing."
  status: WONTFIX
  kind: leaf
  owner: agent
  refs: [i1b]

# i4: WONTFIX leaf that depends_on another WONTFIX; exercises inv 12 (WONTFIX->WONTFIX allowed).
- id: i4
  title: "WONTFIX depending on another WONTFIX"
  description: "Both this and i3 are abandoned; WONTFIX->WONTFIX is coherent."
  status: WONTFIX
  kind: leaf
  owner: agent
  depends_on: [i3]
  refs: [i3]

# i5: leaf with a followup PR (DONE + completing + followup); exercises PR role variety.
- id: i5
  title: "Completed leaf with a followup fix PR"
  description: "Done, with a subsequent fix captured."
  status: DONE
  kind: leaf
  owner: agent
  prs:
    - {num: 100, role: completing}
    - {num: 105, role: followup}
  refs: []
